<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#000000;
  --text:#f4efe5;
  --muted:rgba(244,239,229,.84);
  --line:rgba(255,255,255,.18);
  --font-body:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-head:"Playfair Display",Georgia,"Times New Roman",serif;
}

html,body{
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

a{
  color:inherit;
  text-decoration:none;
}

.hero{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  isolation:isolate;
  background:#000;
}

.hero::before{
  content:"";
  position:absolute;
  inset:-6%;
  background:url("/assets/eta_park_page_03.jpg") center center/cover no-repeat;
  transform:scale(1.08) translate3d(0,0,0);
  animation:heroDrift 28s ease-in-out infinite alternate;
  will-change:transform;
  z-index:-3;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center, rgba(0,0,0,.05) 0%, rgba(0,0,0,.24) 48%, rgba(0,0,0,.58) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.50) 0%, rgba(0,0,0,.16) 20%, rgba(0,0,0,.16) 44%, rgba(0,0,0,.34) 68%, rgba(0,0,0,.92) 100%);
  z-index:-2;
}

.hero-topfade{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:18vh;
  background:linear-gradient(to bottom, rgba(0,0,0,.82), rgba(0,0,0,0));
  z-index:-1;
}

.hero-bottomfade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:30vh;
  background:linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0));
  z-index:-1;
}

.hero-content{
  width:min(100%, 1200px);
  padding:40px 24px 110px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.hero-kicker{
  font-size:12px;
  font-weight:600;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:rgba(255,255,255,.82);
  text-shadow:0 2px 14px rgba(0,0,0,.35);
  opacity:0;
  transform:translateY(10px);
  animation:kickerFade 1.2s ease-out .15s forwards;
}

.hero h1{
  margin:0;
  font-family:var(--font-head);
  color:var(--text);
  font-size:clamp(3.2rem, 8vw, 6.6rem);
  line-height:.90;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  text-shadow:
    0 4px 18px rgba(0,0,0,.28),
    0 18px 46px rgba(0,0,0,.40),
    0 0 1px rgba(0,0,0,.25);
  opacity:0;
  transform:translateY(18px) scale(.985);
  animation:titleFade 1.6s cubic-bezier(.2,.8,.2,1) .35s forwards;
}

.hero h1 span{
  display:block;
}

.hero h1 span:first-child{
  margin-bottom:6px;
}

.countries{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:8px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.22em;
  font-size:clamp(.78rem, 1.3vw, 1rem);
  font-weight:600;
  text-shadow:0 2px 12px rgba(0,0,0,.32);
  opacity:0;
  transform:translateY(12px);
  animation:countriesFade 1.2s ease-out .8s forwards;
}

.countries span{
  white-space:nowrap;
}

.sep{
  opacity:.55;
}

.coming{
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  width:calc(100% - 40px);
  text-align:center;
  font-size:.72rem;
  letter-spacing:.30em;
  text-transform:uppercase;
  color:rgba(255,255,255,.52);
  text-shadow:0 2px 10px rgba(0,0,0,.30);
  opacity:0;
  animation:comingFade 1.1s ease-out 1.2s forwards;
}

@keyframes heroDrift{
  0%{
    transform:scale(1.08) translate3d(0,0,0);
  }
  50%{
    transform:scale(1.12) translate3d(-1.2%, -0.8%, 0);
  }
  100%{
    transform:scale(1.10) translate3d(1.2%, 0.7%, 0);
  }
}

@keyframes kickerFade{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes titleFade{
  0%{
    opacity:0;
    transform:translateY(18px) scale(.985);
    filter:blur(4px);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

@keyframes countriesFade{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes comingFade{
  to{
    opacity:1;
  }
}

@media (max-width:700px){
  .hero{
    min-height:100svh;
  }

  .hero-content{
    padding:28px 20px 90px;
    gap:16px;
  }

  .hero-kicker{
    font-size:11px;
    letter-spacing:.28em;
  }

  .hero h1{
    font-size:clamp(2.7rem, 13vw, 4.6rem);
    letter-spacing:.03em;
  }

  .countries{
    gap:10px;
    letter-spacing:.16em;
    padding-top:16px;
  }

  .coming{
    font-size:.66rem;
    letter-spacing:.22em;
    bottom:18px;
  }
}

@media (prefers-reduced-motion:reduce){
  .hero::before{
    animation:none;
    transform:scale(1.08);
  }

  .hero-kicker,
  .hero h1,
  .countries,
  .coming{
    opacity:1;
    transform:none;
    animation:none;
    filter:none;
  }
}
</style>
</head>
<body>
<section class="hero" aria-label="Experience The Amazon cinematic landing section">
  <div class="hero-topfade" aria-hidden="true"></div>
  <div class="hero-bottomfade" aria-hidden="true"></div>

  <div class="hero-content">
    <p class="hero-kicker">Rainforest travel across South America</p>
    <h1><span>Experience</span><span>The Amazon</span></h1>

    <div class="countries" aria-label="Featured Amazon countries">
      <span>Brazil</span>
      <span class="sep">|</span>
      <span>Peru</span>
      <span class="sep">|</span>
      <span>Ecuador</span>
      <span class="sep">|</span>
      <span>Colombia</span>
      <span class="sep">|</span>
      <span>Bolivia</span>
    </div>
  </div>

  <div class="coming">Coming soon</div>
</section>
</body>
