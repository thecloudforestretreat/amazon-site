<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#000000;
  --text:#f4efe5;
  --muted:rgba(244,239,229,.84);
}

html,body{
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:"Inter", Arial, sans-serif;
  color:var(--text);
  overflow-x:hidden;
}

.hero{
  position:relative;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  inset:-6%;
  background:url("/assets/eta_park_page_03.jpg") center/cover no-repeat;
  animation:heroDrift 28s ease-in-out infinite alternate;
  transform:scale(1.1);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center, rgba(0,0,0,.2), rgba(0,0,0,.7)),
    linear-gradient(to bottom, rgba(0,0,0,.6), rgba(0,0,0,.95));
}

.content{
  position:relative;
  z-index:2;
  max-width:900px;
  padding:20px;
}

.kicker{
  font-size:12px;
  letter-spacing:.35em;
  text-transform:uppercase;
  opacity:.8;
  margin-bottom:12px;
}

h1{
  font-family:"Playfair Display", serif;
  font-size:clamp(2.8rem,7vw,5.5rem);
  letter-spacing:.06em;
  line-height:.95;
  margin-bottom:18px;
}

.countries{
  font-size:clamp(.7rem,1.2vw,1rem);
  letter-spacing:.25em;
  text-transform:uppercase;
  opacity:.85;
  margin-top:12px;
}

.coming{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  font-size:.7rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  opacity:.5;
}

@keyframes heroDrift{
  0%{transform:scale(1.1) translate(0,0);}
  50%{transform:scale(1.14) translate(-1%, -1%);}
  100%{transform:scale(1.12) translate(1%,1%);}
}
</style>
</head>

<body>

<section class="hero">
  <div class="content">
    <div class="kicker">Rainforest travel across South America</div>
    <h1>Experience The Amazon</h1>
    <div class="countries">

    </div>
  </div>

  <div class="coming">Coming soon</div>
