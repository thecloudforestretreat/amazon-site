<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience The Amazon | Amazon Rainforest Travel</title>
<meta name="description" content="Experience the Amazon across Brazil, Peru, Ecuador, Colombia and Bolivia. A new rainforest travel platform coming soon.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://experiencetheamazon.com/">

<meta property="og:type" content="website">
<meta property="og:title" content="Experience The Amazon">
<meta property="og:description" content="A cinematic Amazon travel experience coming soon.">
<meta property="og:image" content="https://experiencetheamazon.com/assets/eta_park_page_03.jpg">

<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:"Inter", sans-serif;
  background:#000;
  color:#f4efe5;
}

.hero{
  position:relative;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  inset:-6%;
  background:url("/assets/eta_park_page_03.jpg") center/cover no-repeat;
  animation:move 28s ease-in-out infinite alternate;
  transform:scale(1.1);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.6), rgba(0,0,0,.9));
}

.content{
  position:relative;
  z-index:2;
  max-width:900px;
  padding:20px;
}

.kicker{
  font-size:12px;
  letter-spacing:.35em;
  text-transform:uppercase;
  opacity:.8;
  margin-bottom:12px;
}

h1{
  font-family:"Playfair Display", serif;
  font-size:clamp(2.8rem,7vw,5.5rem);
  letter-spacing:.06em;
  line-height:.95;
  margin-bottom:18px;
}

.countries{
  font-size:clamp(.7rem,1.2vw,1rem);
  letter-spacing:.25em;
  text-transform:uppercase;
  opacity:.85;
  margin-top:12px;
}

.coming{
  margin-top:20px;
  font-size:.7rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  opacity:.5;
}

@keyframes move{
  0%{transform:scale(1.1) translate(0,0);}
  50%{transform:scale(1.14) translate(-1%, -1%);}
  100%{transform:scale(1.12) translate(1%,1%);}
}
</style>
</head>

<body>

<section class="hero">
  <div class="content">
    <div class="kicker">Rainforest travel across South America</div>

    <h1>Experience The Amazon</h1>

    <div class="countries">
      Brazil | Peru | Ecuador | Colombia | Bolivia
    </div>

    <div class="coming">Coming soon</div>
  </div>
</section>

</body>
</html>
