<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#000000;
  --surface:#070707;
  --text:#f4efe5;
  --muted:rgba(244,239,229,.84);
  --soft:rgba(244,239,229,.68);
  --line:rgba(255,255,255,.14);
  --max:1200px;
  --shadow:0 24px 70px rgba(0,0,0,.35);
}

html{
  scroll-behavior:smooth;
}

html,body{
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:"Inter", Arial, sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.6;
  overflow-x:hidden;
}

img{
  display:block;
  max-width:100%;
  height:auto;
}

a{
  color:inherit;
  text-decoration:none;
}

.page{
  min-height:100vh;
  background:var(--bg);
}

.hero{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  isolation:isolate;
  overflow:hidden;
  background:#000;
}

.hero-media{
  position:absolute;
  inset:0;
  z-index:-3;
}

.hero-media::before{
  content:"";
  position:absolute;
  inset:-6%;
  background-image:url("/assets/eta_park_page_03.jpg");
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  transform:scale(1.08) translate3d(0,0,0);
  animation:heroDrift 28s ease-in-out infinite alternate;
  will-change:transform;
}

.hero-media::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center, rgba(0,0,0,.04) 0%, rgba(0,0,0,.22) 48%, rgba(0,0,0,.56) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.52) 0%, rgba(0,0,0,.18) 20%, rgba(0,0,0,.16) 44%, rgba(0,0,0,.34) 68%, rgba(0,0,0,.92) 100%);
}

.hero-topfade{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:18vh;
  background:linear-gradient(to bottom, rgba(0,0,0,.86), rgba(0,0,0,0));
  z-index:-1;
}

.hero-bottomfade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:30vh;
  background:linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0));
  z-index:-1;
}

.hero-content{
  width:min(100%, var(--max));
  padding:40px 24px 72px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.hero-kicker{
  font-size:12px;
  font-weight:600;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:rgba(255,255,255,.8);
}

.hero h1{
  font-family:"Playfair Display", Georgia, serif;
  font-size:clamp(2.6rem, 7vw, 5.8rem);
  line-height:.92;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-wrap:balance;
  text-shadow:0 10px 40px rgba(0,0,0,.34);
}

.countries{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:8px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.18);
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.22em;
  font-size:clamp(.72rem, 1.3vw, 1rem);
  font-weight:500;
}

.countries span{
  white-space:nowrap;
}

.sep{
  opacity:.55;
}

.content{
  width:min(100% - 40px, var(--max));
  margin:0 auto;
  padding:56px 0 72px;
}

.intro{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:28px;
  align-items:start;
}

.card{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.intro-copy{
  padding:30px;
}

.intro-copy h2{
  font-family:"Playfair Display", Georgia, serif;
  font-size:clamp(1.7rem, 3vw, 2.5rem);
  line-height:1.08;
  margin-bottom:14px;
}

.intro-copy p{
  color:var(--muted);
  margin-bottom:12px;
}

.quick-facts{
  padding:30px;
}

.quick-facts h2{
  font-family:"Playfair Display", Georgia, serif;
  font-size:clamp(1.4rem, 2.4vw, 2rem);
  line-height:1.12;
  margin-bottom:18px;
}

.fact-list{
  display:grid;
  gap:14px;
}

.fact{
  padding:14px 0;
  border-top:1px solid var(--line);
}

.fact:first-child{
  border-top:none;
  padding-top:0;
}

.fact strong{
  display:block;
  font-size:1rem;
  color:var(--text);
  margin-bottom:4px;
}

.fact span{
  color:var(--soft);
  font-size:.98rem;
}

@keyframes heroDrift{
  0%{
    transform:scale(1.08) translate3d(0,0,0);
  }
  50%{
    transform:scale(1.12) translate3d(-1.2%, -0.8%, 0);
  }
  100%{
    transform:scale(1.1) translate3d(1.2%, 0.7%, 0);
  }
}

@media (max-width: 900px){
  .intro{
    grid-template-columns:1fr;
  }
}

@media (max-width: 700px){
  .hero{
    min-height:100svh;
  }

  .hero-content{
    padding:28px 20px 88px;
    gap:16px;
  }

  .hero-kicker{
    font-size:11px;
    letter-spacing:.28em;
  }

  .hero h1{
    letter-spacing:.04em;
  }

  .countries{
    gap:10px;
    letter-spacing:.16em;
    padding-top:16px;
  }

  .intro-copy,
  .quick-facts{
    padding:24px 20px;
  }
}

@media (prefers-reduced-motion: reduce){
  html{
    scroll-behavior:auto;
  }

  .hero-media::before{
    animation:none;
    transform:scale(1.08);
  }
}
</style>
</head>
<body>
<main class="page">
  <section class="hero" aria-label="Experience The Amazon cinematic landing section">
    <div class="hero-media" aria-hidden="true"></div>
    <div class="hero-topfade" aria-hidden="true"></div>
    <div class="hero-bottomfade" aria-hidden="true"></div>

    <div class="hero-content">
      <p class="hero-kicker">Rainforest travel across South America</p>
      <h1>Experience The Amazon</h1>

      <div class="countries" aria-label="Featured Amazon countries">
        <span>Brazil</span>
        <span class="sep">|</span>
        <span>Peru</span>
        <span class="sep">|</span>
        <span>Ecuador</span>
        <span class="sep">|</span>
        <span>Colombia</span>
        <span class="sep">|</span>
        <span>Bolivia</span>
      </div>
    </div>
  </section>
</main>
</body>
